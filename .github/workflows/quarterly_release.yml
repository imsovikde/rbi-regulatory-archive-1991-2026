name: "Quarterly Release & CITATION Version Tagger"

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Verified Signing
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_committer_name: "Souvik Dey"
          git_committer_email: "imsovikde@gmail.com"

      - name: Compute Tag Name
        id: tag
        run: |
          VERSION="v$(date -u +%Y.%m).0"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create Signed Release Tag
        run: |
          git tag -s -m "RBI Regulatory Archive Quarterly Release ${{ steps.tag.outputs.version }}" "${{ steps.tag.outputs.version }}"
          git push origin "${{ steps.tag.outputs.version }}"
