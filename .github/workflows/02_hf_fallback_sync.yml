name: "02 - Fallback Weekly RBI + HF Sync (imsovikde Verified)"

# Secondary Thursday fallback sync. Delegates directly to the unified
# 02_weekly_rbi_hf_github_sync.yml pipeline so discovery, OCR conversion,
# index rebuild, verification, and commit formatting stay identical.

on:
  schedule:
    - cron: "30 2 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fallback-sync:
    uses: ./.github/workflows/02_weekly_rbi_hf_github_sync.yml
    secrets: inherit
