name: "Build Sharded SQLite FTS5 & Zstandard Release"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install zstandard

      - name: Compile SQLite FTS5 Database
        run: |
          python3 scripts/compile_sqlite_fts5.py

      - name: Compress Database with Zstandard Dictionary
        run: |
          python3 -c "
          import os, zstandard as zstd
          dict_path = 'index/rbi_corpus.zdict'
          if os.path.exists(dict_path):
              zdict = zstd.ZstdCompressionDict(open(dict_path, 'rb').read())
              cctx = zstd.ZstdCompressor(level=12, dict_data=zdict)
          else:
              cctx = zstd.ZstdCompressor(level=12)
          with open('rbi_doc_mcp_fts5.sqlite', 'rb') as src, open('rbi_doc_mcp_fts5.sqlite.zst', 'wb') as dst:
              dst.write(cctx.compress(src.read()))
          "

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbi-doc-mcp-fts5-sqlite
          path: rbi_doc_mcp_fts5.sqlite.zst
