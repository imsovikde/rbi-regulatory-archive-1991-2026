name: "02 - Weekly RBI + HF + GitHub Sync (imsovikde Verified)"

# Weekly regulatory synchronization pipeline.
# Every Monday 02:30 UTC: crawl live RBI endpoints, register any new PDFs
# (inventory + ledger + URL list), backfill them to Hugging Face (when
# HF_TOKEN is configured), convert them with the normal runner, rebuild
# the indexes, and commit once as Souvik Dey with a Verified signature.
# If Hugging Face reports zero new files, the direct RBI crawl still
# runs, so a file HF missed is never missed here. New documents join the
# same inventory/ledger/STATE system as the main conversion, so the
# runner needs no separate sync mode.
#
# NOTE: HF_TOKEN is the only secret not yet configured in this repository.
# To enable the Hugging Face backfill step, add it once:
#   gh secret set HF_TOKEN --repo imsovikde/rbi-regulatory-archive-1991-2026
# Until then the register step logs a warning, skips the HF upload, and
# still converts every new RBI PDF it finds directly.

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: rbi-weekly-sync-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository with Personal Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Verified Commit Signing for Souvik Dey (imsovikde)
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_name: "Souvik Dey"
          git_user_email: "imsovikde@gmail.com"

      - name: Set Up System PDF and OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-hin \
            ghostscript \
            poppler-utils \
            fonts-dejavu \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            qpdf

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Canonical Extraction and OCR Stack
        run: |
          pip install --upgrade pip
          pip install \
            firecrawl-anydoc \
            pymupdf \
            huggingface_hub \
            httpx \
            tenacity \
            pyyaml \
            tqdm
          pip install \
            rapidocr-onnxruntime \
            onnxruntime \
            paddlepaddle \
            paddleocr \
            paddlex \
            ocrmypdf \
            Pillow \
            sympy || true

      - name: Discover New RBI Documents (Direct Crawl)
        run: |
          mkdir -p .cache/sync sync
          python3 -m src.rbi_pipeline.rbi_crawler \
            --urls manifest/pdf_final_direct_urls.txt \
            --ledger manifest/sha256_conversion_ledger.csv \
            --out .cache/sync/new_documents.json

      - name: Register New Documents (Inventory + Ledger + HF Backfill)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/register_new_documents.py \
            --new-documents .cache/sync/new_documents.json \
            --inventory manifest/hf_88236_inventory.jsonl \
            --ledger manifest/sha256_conversion_ledger.csv \
            --urls-file manifest/pdf_final_direct_urls.txt \
            --out sync/registered.json \
            --work-dir .cache/sync

      - name: Convert New Documents to Markdown
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Normal runner pass: the newly registered rows are pending in
          # the inventory, so they convert, commit per batch, and rebuild
          # the indexes exactly like the main conversion.
          python3 -m src.rbi_pipeline.runner \
            --batch-size 75 \
            --max-runtime-seconds 15000

      - name: Commit Sync Leftovers as Souvik Dey (Verified)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # The runner already committed the .md files, ledger, STATE,
          # and indexes. What remains is the inventory, the URL list,
          # and the sync record itself. Only those paths are staged, so
          # a week with zero new documents commits nothing.
          git add manifest/hf_88236_inventory.jsonl \
            manifest/pdf_final_direct_urls.txt \
            sync/registered.json
          if git diff --cached --quiet; then
            echo "No new RBI documents this week. Nothing to commit."
            exit 0
          fi
          NEW_COUNT=$(python3 -c "import json; print(len(json.load(open('sync/registered.json'))))")
          SYNC_DATE=$(date -u +%F)
          git commit -S -m "chore(sync): ${NEW_COUNT} new RBI documents -> MD | ${SYNC_DATE} | imsovikde verified"
          git pull --rebase origin main
          git push origin HEAD:main
