name: "02 - Weekly RBI + HF + GitHub Sync (imsovikde Verified)"

# Unified regulatory synchronization pipeline.
# Crawls live RBI endpoints and checks upstream Hugging Face dataset,
# verifies and caches new PDFs (backfilling HF when HF_TOKEN is configured),
# converts them to Markdown with anydoc + OCR fallback, rebuilds every linked
# index, README, llms*.txt, math kernel, SEO artifact, and SQLite FTS5 bundle,
# runs all verification gates, and pushes ONE GPG-signed commit with full
# endpoint, resource, and conversion intelligence in the commit message.

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      force_rebuild_indexes:
        description: "Force full index, kernel, and FTS5 rebuild even on zero new PDFs"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      force_rebuild_indexes:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  weekly-sync:
    concurrency:
      group: rbi-markdown-conversion-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository with Personal Token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 0

      - name: Configure Verified Commit Signing for Souvik Dey (imsovikde)
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_committer_name: "Souvik Dey"
          git_committer_email: "imsovikde@gmail.com"

      - name: Configure Git Author Identity and Allowed Signers
        run: |
          git config --global user.name "Souvik Dey"
          git config --global user.email "imsovikde@gmail.com"
          git config --global gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"

      - name: Set Up System PDF and OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-hin \
            ghostscript \
            poppler-utils \
            fonts-dejavu \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            qpdf

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Canonical Extraction and OCR Stack
        run: |
          python -m pip install --upgrade pip
          pip install \
            firecrawl-anydoc \
            pymupdf \
            huggingface_hub \
            httpx \
            tenacity \
            pyyaml \
            tqdm \
            zstandard
          pip install \
            rapidocr-onnxruntime \
            onnxruntime \
            ocrmypdf \
            Pillow \
            sympy || true

      - name: Check Hugging Face Dataset Upstream Delta
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .cache/sync sync
          python3 scripts/hf_scheduled_sync.py \
            --inventory manifest/hf_88236_inventory.jsonl \
            --ledger manifest/sha256_conversion_ledger.csv \
            --out .cache/sync/new_hf_documents.json \
            --report-out .cache/sync/hf_sync_report.json

      - name: Discover New RBI Documents (Direct Endpoint Crawl)
        run: |
          mkdir -p .cache/sync sync
          python3 -m src.rbi_pipeline.rbi_crawler \
            --urls manifest/pdf_final_direct_urls.txt \
            --ledger manifest/sha256_conversion_ledger.csv \
            --inventory manifest/hf_88236_inventory.jsonl \
            --out .cache/sync/new_rbi_documents.json \
            --report-out .cache/sync/crawl_report.json

      - name: Combine and Deduplicate Discovered Candidates
        run: |
          python3 - << 'PY'
          import json, os
          from src.rbi_pipeline.rbi_crawler import normalize_url

          by_norm = {}
          for fn in (".cache/sync/new_rbi_documents.json", ".cache/sync/new_hf_documents.json"):
              if not os.path.exists(fn):
                  continue
              with open(fn, encoding="utf-8") as handle:
                  docs = json.load(handle)
              for doc in docs:
                  norm = normalize_url(doc.get("pdf_url"))
                  if norm and norm not in by_norm:
                      by_norm[norm] = doc
          combined = sorted(by_norm.values(), key=lambda d: d.get("pdf_url", ""))
          print(f"Combined {len(combined)} unique discovered candidate(s)")
          with open(".cache/sync/new_documents.json", "w", encoding="utf-8") as out:
              json.dump(combined, out, indent=2, ensure_ascii=False)
          PY

      - name: Register New Documents (Inventory + Ledger + PDF Cache + HF Backfill)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/register_new_documents.py \
            --new-documents .cache/sync/new_documents.json \
            --inventory manifest/hf_88236_inventory.jsonl \
            --ledger manifest/sha256_conversion_ledger.csv \
            --urls-file manifest/pdf_final_direct_urls.txt \
            --out sync/registered.json \
            --work-dir .cache/sync \
            --pdf-cache-dir .cache/sync/pdfs \
            --report-out .cache/sync/register_report.json \
            --fail-on-all-skipped

      - name: Convert New Documents to Markdown (No Commit Mode)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE_REBUILD: ${{ inputs.force_rebuild_indexes == true && 'true' || 'false' }}
        run: |
          EXTRA_FLAGS=""
          if [ "${FORCE_REBUILD}" = "true" ]; then
            EXTRA_FLAGS="--force-rebuild-index"
          fi
          python3 -m src.rbi_pipeline.runner \
            --no-commit \
            --batch-size 200 \
            --max-runtime-seconds 15000 \
            --pdf-cache-dir .cache/sync/pdfs \
            --run-report .cache/sync/conversion_report.json \
            ${EXTRA_FLAGS}

      - name: Rebuild Advanced Indexes, Mathematical Kernels, FTS5 & Metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE_REBUILD: ${{ inputs.force_rebuild_indexes == true && 'true' || 'false' }}
        run: |
          CONVERTED=$(python3 -c "import json, os; d=json.load(open('.cache/sync/conversion_report.json')) if os.path.exists('.cache/sync/conversion_report.json') else {}; print(d.get('converted_count', 0))")
          CHANGED=$(git status --porcelain -- data/ index/ manifest/ seo/ sync/ README.md INDEX.md PROGRESS.md STATE.json llms*.txt | wc -l)
          if [ "${CONVERTED}" -eq "0" ] && [ "${CHANGED}" -eq "0" ] && [ "${FORCE_REBUILD}" != "true" ]; then
            echo "Zero new conversions and clean tree; skipping downstream index/FTS5 rebuild."
            exit 0
          fi
          python3 scripts/build_advanced_indexes.py
          python3 -m src.rbi_pipeline.metadata_sync
          python3 -m src.rbi_pipeline.math_kernel.mphf_arena
          python3 -m src.rbi_pipeline.math_kernel.elias_fano
          python3 -m src.rbi_pipeline.math_kernel.jacobian_dag
          python3 scripts/compile_sqlite_fts5.py
          python3 - << 'PY'
          import os, zstandard as zstd
          dict_path = "index/rbi_corpus.zdict"
          if os.path.exists(dict_path):
              zdict = zstd.ZstdCompressionDict(open(dict_path, "rb").read())
              cctx = zstd.ZstdCompressor(level=12, dict_data=zdict)
          else:
              cctx = zstd.ZstdCompressor(level=12)
          with open("rbi_doc_mcp_fts5.sqlite", "rb") as src, open("rbi_doc_mcp_fts5.sqlite.zst", "wb") as dst:
              dst.write(cctx.compress(src.read()))
          os.remove("rbi_doc_mcp_fts5.sqlite")
          PY
          python3 _pipeline/hf_readme_updater.py || true
          python3 -c "from src.rbi_pipeline.dynamic_meta import sync_github_repo_metadata; sync_github_repo_metadata('.')" || true

      - name: Run Pre-Commit Link, Style, and 12-Gate Integrity Verification
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild_indexes == true && 'true' || 'false' }}
        run: |
          CHANGED=$(git status --porcelain -- data/ index/ manifest/ seo/ sync/ README.md INDEX.md ARCHITECTURE.md PROGRESS.md STATE.json llms*.txt rbi_doc_mcp_fts5.sqlite.zst | wc -l)
          if [ "${CHANGED}" -eq "0" ] && [ "${FORCE_REBUILD}" != "true" ]; then
            echo "No sync changes to verify."
            exit 0
          fi
          python3 scripts/verify_links.py
          python3 -m src.rbi_pipeline.human_style_linter
          python3 scripts/audit_parity.py

      - name: Commit All Synced Documents & Linked Indexes in One Verified Commit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git add -- data/ index/ manifest/ seo/ sync/ \
            README.md INDEX.md ARCHITECTURE.md PROGRESS.md STATE.json AUDIT.md \
            robots.txt llms.txt llms-full.txt llms-*.txt rbi_doc_mcp_fts5.sqlite.zst
          if [ -f CITATION.cff ]; then
            git add -- CITATION.cff
          fi
          if git diff --cached --quiet; then
            echo "Zero delta this cycle. Nothing to commit." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 - << 'PY'
          import os, subprocess, sys
          files = subprocess.check_output(
              ["git", "-c", "core.quotepath=false", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines()
          limit = 95 * 1024 * 1024
          oversized = [(f, os.path.getsize(f)) for f in files if os.path.exists(f) and os.path.getsize(f) > limit]
          if oversized:
              for f, sz in oversized:
                  print(f"ERROR: staged file {f} is {sz} bytes (> 95 MiB safety cap)", file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(files)} staged file(s) are under GitHub's 100 MB limit.")
          PY
          python3 scripts/generate_sync_commit_message.py \
            --mode sync \
            --crawl-report .cache/sync/crawl_report.json \
            --register-report .cache/sync/register_report.json \
            --conversion-report .cache/sync/conversion_report.json \
            --hf-report .cache/sync/hf_sync_report.json \
            --out /tmp/sync-commit-msg.txt
          echo "--- Generated Intelligent Commit Message ---"
          cat /tmp/sync-commit-msg.txt
          echo "--------------------------------------------"
          cat /tmp/sync-commit-msg.txt >> "${GITHUB_STEP_SUMMARY}"
          git commit -S -F /tmp/sync-commit-msg.txt
          git log -1 --show-signature
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "Successfully pushed single verified sync commit to main."
              exit 0
            fi
            sleep 5
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
