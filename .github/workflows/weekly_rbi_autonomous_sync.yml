name: "Weekly RBI Autonomous Delta Sync & Cloudflare Webhook"

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: rbi-markdown-conversion-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository with Personal Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 0

      - name: Configure Verified Commit Signing for Souvik Dey (imsovikde)
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_name: "Souvik Dey"
          git_user_email: "imsovikde@gmail.com"

      - name: Configure SSH Allowed Signers
        run: |
          git config --global gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Extraction Dependencies
        run: |
          pip install --upgrade pip
          pip install httpx huggingface_hub zstandard pyyaml tenacity tqdm

      - name: Discover New RBI Documents
        run: |
          mkdir -p .cache/sync sync
          python3 -m src.rbi_pipeline.rbi_crawler \
            --urls manifest/pdf_final_direct_urls.txt \
            --ledger manifest/sha256_conversion_ledger.csv \
            --out .cache/sync/new_documents.json

      - name: Register and Convert New Documents
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/register_new_documents.py \
            --new-documents .cache/sync/new_documents.json \
            --inventory manifest/hf_88236_inventory.jsonl \
            --ledger manifest/sha256_conversion_ledger.csv \
            --urls-file manifest/pdf_final_direct_urls.txt \
            --out sync/registered.json \
            --work-dir .cache/sync

          python3 -m src.rbi_pipeline.runner \
            --batch-size 75 \
            --max-runtime-seconds 12000

      - name: Rebuild Mathematical Kernels and Advanced Indexes
        run: |
          python3 -m src.rbi_pipeline.math_kernel.mphf_arena
          python3 -m src.rbi_pipeline.math_kernel.elias_fano
          python3 -m src.rbi_pipeline.math_kernel.jacobian_dag
          python3 scripts/build_advanced_indexes.py
          python3 _pipeline/hf_readme_updater.py || true

      - name: Commit Verified Sync Leftovers
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git add manifest/ sync/ README.md INDEX.md STATE.json AUDIT.md llms*.txt index/ data/ seo/
          if git diff --cached --quiet; then
            echo "Zero delta this week. Exiting cleanly with 0 commits."
            exit 0
          fi
          NEW_COUNT=$(python3 -c "import json, os; print(len(json.load(open('sync/registered.json'))) if os.path.exists('sync/registered.json') else 0)")
          SYNC_DATE=$(date -u +%F)
          git commit -S -m "chore(sync): ${NEW_COUNT} new RBI documents -> MD | ${SYNC_DATE} | imsovikde verified"
          git pull --rebase origin main
          git push origin HEAD:main
