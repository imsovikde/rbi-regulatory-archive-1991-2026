name: "Weekly RBI Autonomous Delta Sync & Cloudflare Webhook"

# Manual trigger alias delegating to the unified 02_weekly_rbi_hf_github_sync.yml
# pipeline (Monday/Thursday schedules live on 02_weekly and 02_hf_fallback so
# concurrent Monday runs never collide).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/02_weekly_rbi_hf_github_sync.yml
    secrets: inherit
