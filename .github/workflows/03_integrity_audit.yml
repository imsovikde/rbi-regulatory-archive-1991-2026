name: "03 - Integrity Audit (imsovikde Verified)"

# Weekly integrity audit. Verifies 1:1 parity between the conversion
# ledger and the Markdown files, STATE.json counts, the last commit
# author, and url_to_path_map coverage. Writes the result to AUDIT.md
# and commits it (only when it changed) as Souvik Dey with a Verified
# signature. The audit never modifies any .md file.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: rbi-integrity-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository with Personal Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Verified Commit Signing for Souvik Dey (imsovikde)
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_name: "Souvik Dey"
          git_user_email: "imsovikde@gmail.com"

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Integrity Audit
        id: audit
        run: |
          python3 scripts/audit_parity.py || echo "AUDIT_FAILED=1" >> "${GITHUB_ENV}"

      - name: Commit AUDIT.md When It Changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git add AUDIT.md
          if git diff --cached --quiet; then
            echo "AUDIT.md unchanged. Nothing to commit."
            exit 0
          fi
          COUNTS=$(grep -oP '<!-- RESULT passed=\K[0-9]+ total=[0-9]+' AUDIT.md | sed 's/ total=/\//')
          AUDIT_DATE=$(date -u +%F)
          git commit -S -m "chore(audit): integrity audit ${AUDIT_DATE} | ${COUNTS} checks"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the Run When Any Check Failed
        if: ${{ env.AUDIT_FAILED == '1' }}
        run: |
          echo "Integrity audit failed. See AUDIT.md for the failing checks."
          exit 1
