name: "00 - Bootstrap Pipeline (imsovikde Verified)"

# One-time bootstrap: lands the conversion pipeline bundle from the
# Hugging Face dataset into this repository, then starts the continuous
# conversion workflow. Run once by hand (workflow_dispatch), after the
# workflow files themselves have been landed in .github/workflows/ via
# the GitHub web UI.
#
# IMPORTANT: this workflow must NOT write into .github/workflows/.
# The checkout token (GH_PAT) is a fine-grained PAT with Contents
# read/write only; it has no Workflows scope, so any push that touches
# .github/workflows/ is rejected by GitHub. Workflow files are therefore
# landed separately through the web UI, never through this workflow.
# Any bundle manifest line under .github/workflows/ is skipped below.

on:
  workflow_dispatch:

concurrency:
  group: rbi-bootstrap-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository with Personal Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          # Always check out the tip of main at job start, not the commit
          # that triggered the run. A run dispatched while another run is
          # active waits behind the concurrency group; without this, it
          # checks out a stale commit, its startup index-recovery commit
          # is built from stale state, and the pull --rebase onto the
          # newer main conflicts (run 43394196880 failed exactly this way
          # after 3h46m queued). With ref: main a queued run can never
          # go stale. Do not remove this line.
          ref: main
          fetch-depth: 0

      - name: Configure Verified Commit Signing for Souvik Dey (imsovikde)
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_name: "Souvik Dey"
          git_user_email: "imsovikde@gmail.com"

      - name: Download Pipeline Bundle from Hugging Face
        env:
          HF_DATASET: "imsovikde/rbi-regulatory-archive-1991-2026"
        run: |
          set -euo pipefail
          HF_BASE="https://huggingface.co/datasets/${HF_DATASET}/resolve/main/_pipeline/bootstrap"
          curl -fsSL "${HF_BASE}/MANIFEST.txt" -o /tmp/bundle-MANIFEST.txt
          echo "Bundle manifest:"
          cat /tmp/bundle-MANIFEST.txt
          while IFS= read -r rel; do
            [ -z "${rel}" ] && continue
            case "${rel}" in
              \#*) continue ;;
              .github/workflows/*)
                echo "SKIP (workflow files are landed via the web UI, not by this job): ${rel}"
                continue
                ;;
            esac
            mkdir -p "$(dirname "${rel}")"
            echo "Fetching ${rel} ..."
            curl -fsSL "${HF_BASE}/${rel}" -o "${rel}"
          done < /tmp/bundle-MANIFEST.txt
          # Safety: if this repo already has conversion progress, never
          # let the bundle overwrite it. Restore the live progress
          # files from git when the checked-out STATE.json shows work
          # already done.
          if [ -f STATE.json ]; then
            DONE_NOW=$(python3 -c "import json; print(json.load(open('STATE.json')).get('done_count', 0))")
            if [ "${DONE_NOW}" -gt "0" ]; then
              echo "Repo already has ${DONE_NOW} converted files; preserving live progress files."
              git checkout -- STATE.json PROGRESS.md manifest/sha256_conversion_ledger.csv manifest/master_catalog.jsonl index/ 2>/dev/null || true
            fi
          fi

      - name: Commit Pipeline Bundle as Souvik Dey (Verified)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Bundle already landed. Nothing to commit."
            exit 0
          fi
          git commit -S -m "feat: land RBI Markdown conversion pipeline (bootstrap)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: "Dispatch Continuous Conversion Workflow (pilot: 2 batches, no self-chain)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN is correct here: it can dispatch workflows, and
          # the dispatched run still commits as imsovikde (GPG-signed,
          # pushed with GH_PAT). See 01_continuous_conversion.yml.
          # PILOT: only 2 batches (150 files), self_chain=false, so a
          # human verifies the first .md files and Verified commits
          # before the full run is dispatched by hand. Do not raise
          # these numbers in this bootstrap step.
          gh workflow run 01_continuous_conversion.yml --ref main \
            -f batch_size=75 -f max_batches_per_run=2 -f self_chain=false
