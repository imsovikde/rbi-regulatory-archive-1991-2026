name: "Verify Index Integrity & Zero-404 Links"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rbi-integrity-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH Allowed Signers
        run: |
          git config --global gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"

      - name: Set Up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install zstandard

      - name: Verify Zero Broken Links
        run: |
          python3 scripts/verify_links.py

      - name: Verify Human Style Guidelines
        run: |
          python3 -m src.rbi_pipeline.human_style_linter

      - name: Run 12-Gate Integrity Audit
        run: |
          python3 scripts/audit_parity.py
